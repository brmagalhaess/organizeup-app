name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organizeup_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Teste de isolamento (RLS) em Postgres real
        run: pnpm test:integration
        env:
          TEST_DATABASE_OWNER_URL: postgres://postgres:postgres@localhost:5432/organizeup_test

  image-e2e:
    name: image-e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: organizeup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build da imagem do worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          load: true
          tags: organizeup-worker:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build da imagem web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          load: true
          tags: organizeup-web:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sobe worker (migrações) e web a partir das imagens
        run: |
          docker run -d --name worker --network host \
            -e MIGRATION_DATABASE_URL=postgres://postgres:postgres@localhost:5432/organizeup \
            -e DATABASE_URL=postgres://ou_worker:ci-worker-pass@localhost:5432/organizeup \
            -e OU_APP_DB_PASSWORD=ci-app-pass -e OU_WORKER_DB_PASSWORD=ci-worker-pass -e OU_ADMIN_DB_PASSWORD=ci-admin-pass \
            organizeup-worker:ci
          for i in $(seq 1 60); do
            docker logs worker 2>&1 | grep -q "worker pronto" && break
            if [ "$(docker inspect -f '{{.State.Running}}' worker)" != "true" ]; then docker logs worker; exit 1; fi
            sleep 2
          done
          docker run -d --name web --network host \
            -e DATABASE_URL=postgres://ou_app:ci-app-pass@localhost:5432/organizeup \
            -e BETTER_AUTH_SECRET=ci-secret-0123456789abcdef0123456789abcdef \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e AUTH_RATE_LIMIT=disabled \
            organizeup-web:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"commit":"${{ github.sha }}"'
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @organizeup/web exec playwright install --with-deps chromium
      - name: E2E contra a imagem
        run: pnpm test:e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
      - name: Logs dos containers
        if: failure()
        run: |
          docker logs worker || true
          docker logs web || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  publish:
    name: publish
    needs: image-e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome das imagens (minúsculas)
        id: names
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Publica worker
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.names.outputs.repo }}-worker:${{ github.sha }}
            ${{ steps.names.outputs.repo }}-worker:main
          cache-from: type=gha
      - name: Publica web
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.names.outputs.repo }}-web:${{ github.sha }}
            ${{ steps.names.outputs.repo }}-web:main
          cache-from: type=gha
